<!-- SynapSH brand logo used by the repository README and desktop assets. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title description">
  <title id="title">SynapSH logo</title>
  <desc id="description">Two connected cyan and amber rings forming the SynapSH mark.</desc>
  <defs>
    <linearGradient id="cyan" x1="17" y1="12" x2="53" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="amber" x1="28" y1="34" x2="63" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#facc15"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <path
    d="M48.2 38.8a17 17 0 1 0-12.7 5.9"
    fill="none"
    stroke="url(#cyan)"
    stroke-width="9"
    stroke-linecap="round"
  />
  <path
    d="M31.8 41.2a17 17 0 1 0 12.7-5.9"
    fill="none"
    stroke="url(#amber)"
    stroke-width="9"
    stroke-linecap="round"
  />
  <circle cx="40" cy="40" r="5" fill="#0b0d10"/>
</svg>
