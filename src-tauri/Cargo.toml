[package]
name = "synapsh"
version = "0.1.0"
description = "光析 - 基于 Tauri 的现代化 SSH 客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "synapsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-frame = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
async-trait = "0.1"

# SSH 相关依赖 - 使用最新稳定版本
russh = "0.50.0-beta.7"
russh-keys = "0.50.0-beta.7"
russh-sftp = "2.0.0-beta.5"

# 日志
log = "0.4"
env_logger = "0.11"

# 其他工具
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
time = "=0.3.36"
base64ct = "=1.6.0"

# Windows API - 仅 Windows 平台
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
] }
windows-version = "0.1"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
